# Nginx reverse proxy for Trekiva Logistics (TLS via Let's Encrypt / certbot).
# Install: sudo cp deploy/nginx/trekiva-logistics.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/trekiva-logistics.conf /etc/nginx/sites-enabled/
# Replace logistics.example.com with your domain.

upstream trekiva_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name logistics.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logistics.example.com;

    ssl_certificate     /etc/letsencrypt/live/logistics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    # Do NOT add X-Frame-Options: the app is embedded in Shopify admin. The backend sends a
    # Content-Security-Policy frame-ancestors header restricting framing to your shop.

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # Static admin assets are fingerprinted: cache aggressively.
    location /assets/ {
        proxy_pass http://trekiva_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Webhooks must answer quickly; keep buffering on and timeouts short.
    location /webhooks/ {
        proxy_pass http://trekiva_api;
        proxy_read_timeout 15s;
    }

    # Metrics are scraped on the VM itself (http://127.0.0.1:8000/metrics), never from outside.
    # The app also requires METRICS_TOKEN; this is a second lock.
    location = /metrics {
        return 404;
    }

    # Interactive API docs are disabled in production by the app itself.
    location / {
        proxy_pass http://trekiva_api;
    }
}
